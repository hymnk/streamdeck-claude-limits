<!doctype html>
<html>
<head lang="ja">
	<meta charset="utf-8" />
	<style>
		body { background:#2d2d2d; color:#efefef; font-family: -apple-system, "Segoe UI", sans-serif; font-size:12px; margin:0; padding:12px 16px; }
		.row { display:flex; align-items:center; margin-bottom:10px; }
		label { width:110px; flex-shrink:0; }
		select { flex:1; background:#111; color:#efefef; border:1px solid #555; border-radius:4px; padding:5px 6px; font-size:12px; }
		.note { color:#9a9a9a; line-height:1.5; margin-top:14px; }
		h2 { font-size:12px; font-weight:600; color:#cfcfcf; margin:18px 0 10px; padding-top:12px; border-top:1px solid #444; }
		select.size { flex:0 0 72px; margin-left:6px; }
		.colors span { flex:0 0 56px; margin-right:8px; text-align:center; color:#9a9a9a; }
		input[type=color] { flex:0 0 56px; margin-right:8px; height:28px; padding:2px; background:#111; border:1px solid #555; border-radius:4px; cursor:pointer; }
				button { background:#3a3a3a; color:#efefef; border:1px solid #555; border-radius:4px; padding:5px 10px; font-size:12px; cursor:pointer; }
	</style>
</head>
<body>
	<div class="row">
		<label for="metric">表示する枠</label>
		<select id="metric">
			<option value="session">Session(5時間)</option>
			<option value="week">Week(7日間)</option>
			<option value="both">両方(2段表示)</option>
		</select>
	</div>
	<div class="row">
		<label for="valueMode">パーセント</label>
		<select id="valueMode">
			<option value="used">使用率</option>
			<option value="remaining">残量</option>
		</select>
	</div>
	<div class="row">
		<label for="remainTag">残量表示のマーク</label>
		<select id="remainTag">
			<option value="left">Left</option>
			<option value="on">残</option>
			<option value="off">表示しない</option>
		</select>
	</div>
	<h2>文字の見た目</h2>
	<div id="textRows"></div>
	<div class="row"><label></label><button id="resetText" type="button">標準に戻す</button></div>
	<h2 id="colorsTitle">バーの色</h2>
	<div class="row colors"><label></label><span>Session</span><span>Week</span></div>
	<div id="colorsUsed">
		<div class="row colors"><label>70%未満</label><input type="color" id="sessionBarNormal" /><input type="color" id="weekBarNormal" /></div>
		<div class="row colors"><label>70%以上</label><input type="color" id="sessionBarWarn" /><input type="color" id="weekBarWarn" /></div>
		<div class="row colors"><label>90%以上</label><input type="color" id="sessionBarDanger" /><input type="color" id="weekBarDanger" /></div>
	</div>
	<div id="colorsRemain" hidden>
		<div class="row colors"><label>50%超</label><input type="color" id="sessionRemainBarNormal" /><input type="color" id="weekRemainBarNormal" /></div>
		<div class="row colors"><label>25〜50%</label><input type="color" id="sessionRemainBarWarn" /><input type="color" id="weekRemainBarWarn" /></div>
		<div class="row colors"><label>25%以下</label><input type="color" id="sessionRemainBarDanger" /><input type="color" id="weekRemainBarDanger" /></div>
	</div>
	<div class="row"><label></label><button id="resetColors" type="button">標準に戻す</button></div>
	<div class="note">
		Claude Code のログイン情報(~/.claude/.credentials.json)を使って5分ごとに取得します。キーを押すとすぐ更新します。<br />
		スパークがグレーのときは前回取得した値を表示中です。<br />
		文字を大きくしすぎると、2段表示ではパーセントと残り時間が重なることがあります。
	</div>

	<script>
		// Ids must match FONTS in src/render.ts.
		const FONTS = [
			["segoe-bold", "Segoe UI 太字(標準)"],
			["segoe-semibold", "Segoe UI 中太"],
			["segoe-black", "Segoe UI 極太"],
			["segoe-regular", "Segoe UI 細字"],
			["bahnschrift-bold", "Bahnschrift 太字(幅狭)"],
			["bahnschrift-semibold", "Bahnschrift 中太(幅狭)"],
			["meiryo-bold", "メイリオ 太字"],
			["yugothic-bold", "游ゴシック UI 太字"],
			["arial-bold", "Arial 太字"],
			["verdana-bold", "Verdana 太字(幅広)"],
		];
		const SIZES = [70, 80, 90, 100, 110, 120, 130, 140, 150];
		const ROLES = [
			["label", "見出し"],
			["value", "パーセント"],
			["countdown", "残り時間"],
		];

		const DEFAULTS = { metric: "session", valueMode: "used", remainTag: "left" };
		for (const [role] of ROLES) {
			DEFAULTS[role + "Font"] = "segoe-bold";
			DEFAULTS[role + "Size"] = "100";
		}
		// Bar colors per window and usage level; must match DEFAULT_BAR_COLORS in src/render.ts.
		const BAR_DEFAULTS = { Normal: "#d97757", Warn: "#e8a33d", Danger: "#ef574a" };
		for (const which of ["session", "week"]) {
			for (const level of Object.keys(BAR_DEFAULTS)) {
				DEFAULTS[which + "Bar" + level] = BAR_DEFAULTS[level];
				DEFAULTS[which + "RemainBar" + level] = BAR_DEFAULTS[level];
			}
		}
		const FIELDS = Object.keys(DEFAULTS);

		function buildTextRows() {
			const rows = document.getElementById("textRows");
			for (const [role, name] of ROLES) {
				const row = document.createElement("div");
				row.className = "row";
				const label = document.createElement("label");
				label.textContent = name;
				label.htmlFor = role + "Font";
				const font = document.createElement("select");
				font.id = role + "Font";
				for (const [id, text] of FONTS) font.add(new Option(text, id));
				const size = document.createElement("select");
				size.id = role + "Size";
				size.className = "size";
				for (const n of SIZES) size.add(new Option(n + "%", String(n)));
				row.append(label, font, size);
				rows.append(row);
			}
		}
		buildTextRows();

		function applySettings(settings) {
			settings = Object.assign({}, settings || {});
			// Older versions saved one set of colors (barNormal...) for both windows.
			for (const level of Object.keys(BAR_DEFAULTS)) {
				const legacy = settings["bar" + level];
				if (!legacy) continue;
				for (const which of ["session", "week"]) {
					if (!settings[which + "Bar" + level]) settings[which + "Bar" + level] = legacy;
				}
			}
			// Remaining-mode colors start out as a copy of the used-mode ones until they are set on their own.
			for (const which of ["session", "week"]) {
				for (const level of Object.keys(BAR_DEFAULTS)) {
					const own = which + "RemainBar" + level;
					if (!settings[own] && settings[which + "Bar" + level]) settings[own] = settings[which + "Bar" + level];
				}
			}
			settings = Object.assign({}, DEFAULTS, settings);
			for (const field of FIELDS) document.getElementById(field).value = settings[field];
			showColorGrid();
		}

		// The color grid on screen is the one for the current display mode, with thresholds worded for that mode.
		function showColorGrid() {
			const remaining = document.getElementById("valueMode").value === "remaining";
			document.getElementById("colorsUsed").hidden = remaining;
			document.getElementById("colorsRemain").hidden = !remaining;
			document.getElementById("colorsTitle").textContent = remaining ? "バーの色(残量表示のとき)" : "バーの色(使用率表示のとき)";
		}

		function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
			const actionInfo = JSON.parse(inActionInfo);
			const ws = new WebSocket("ws://127.0.0.1:" + inPort);

			ws.onopen = function () {
				ws.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				applySettings(actionInfo.payload && actionInfo.payload.settings);
			};

			ws.onmessage = function (evt) {
				const data = JSON.parse(evt.data);
				if (data.event === "didReceiveSettings") {
					applySettings(data.payload.settings);
				}
			};

			function save() {
				if (ws.readyState !== WebSocket.OPEN) return;
				ws.send(
					JSON.stringify({
						event: "setSettings",
						context: inPropertyInspectorUUID,
						payload: Object.fromEntries(FIELDS.map((field) => [field, document.getElementById(field).value])),
					}),
				);
			}

			for (const field of FIELDS) document.getElementById(field).addEventListener("change", save);
			document.getElementById("valueMode").addEventListener("change", showColorGrid);
			function resetFields(match) {
				for (const field of FIELDS) {
					if (match(field)) document.getElementById(field).value = DEFAULTS[field];
				}
				save();
			}
			document.getElementById("resetText").addEventListener("click", function () {
				resetFields((field) => field.endsWith("Font") || field.endsWith("Size"));
			});
			document.getElementById("resetColors").addEventListener("click", function () {
				const remaining = document.getElementById("valueMode").value === "remaining";
				resetFields((field) => (remaining ? field.includes("RemainBar") : field.includes("Bar") && !field.includes("RemainBar")));
			});
		}
	</script>
</body>
</html>
